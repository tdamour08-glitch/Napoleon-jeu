# Publie le jeu sur GitHub Pages à chaque poussée.
#
# Le jeu est entièrement statique : il n'y a rien à compiler, on
# téléverse le dépôt tel quel.
#
# UNE MANIPULATION EST REQUISE, UNE SEULE FOIS :
#   Settings → Pages → Source : « GitHub Actions ».
# Le jeton fourni aux Actions n'a pas le droit de créer le site Pages
# lui-même — « configure-pages » avec « enablement » échoue sur
# « Resource not accessible by integration ». Une fois la source
# choisie dans les paramètres, ce workflow publie tout seul à chaque
# poussée, sans plus rien à faire.

name: Publier sur GitHub Pages

on:
  push:
    branches: [claude/napoleonic-strategy-game-1exbzx]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Une publication à la fois, sans annuler celle qui est en cours.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publier:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Préparer Pages
        uses: actions/configure-pages@v5

      - name: Téléverser le site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Déployer
        id: deploiement
        uses: actions/deploy-pages@v4
